
<!DOCTYPE html>
<html>
<head>
    <title>Change CSS Class</title>

    <style>
        .good {
            color: green;
            font-weight: bold;
        }

        .bad {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Number Checker</h2>

    <input type="text" id="userInput" placeholder="Enter a number">

    <button onclick="checkNumber()">Check</button>

    <p id="result">Your result will appear here.</p>

    <script>
        function checkNumber() {

            // Read input
            let value = document.getElementById("userInput").value;

            // Convert to number
            let number = Number(value);

            // Find paragraph
            let result = document.getElementById("result");

            // Change text
            result.textContent = "Your number is: " + number;

            // Remove old classes
            result.classList.remove("good", "bad");

            // Apply the correct class
            if (number >= 10) {
                result.classList.add("good");
            } else {
                result.classList.add("bad");
            }
        }
    </script>

</body>
</html>
