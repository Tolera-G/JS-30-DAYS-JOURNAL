//Exercise-1:Click to Change
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>click to Change</title>
</head>
<body>
  <p id="message">Hello! Click the button to change me.</p>
  <button onclick="changeText()">Click Me!</button>

  <h2>Double Calculator</h2>

    <input type="text" id="userInput" placeholder="Enter a number">

    <button onclick="calculateDouble()">Calculate</button>

    <p id="result">Your result will appear here.</p>

   <script>
    function changeText() {
        document.getElementById("message").textContent = "You clicked the button!";
    }

            function calculateDouble() {

            // Read the input value
            let value = document.getElementById("userInput").value;

            // Check its data type
            console.log(typeof value);

            // Convert text into a number
            let number = Number(value);

            // Calculate double
            let double = number * 2;

            // Display the result
            document.getElementById("result").textContent =
                "Double: " + double;
        }

   </script>
  
</body>
</html>
